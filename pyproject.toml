[project]
name = "fl-async"
version = "1.0.0"
description = "A minimal asynchronous buffered federated learning server and demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "torch>=2.13.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
fl_async = "fl_async.main:run"
fl-demo = "clients.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fl_async*", "clients*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
